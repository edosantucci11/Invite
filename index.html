<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mercoledì da te 💕</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #ffd1dc, #ffe9d6);
    color: #5a2a3a;
    padding: 16px;
  }
  .card {
    background: #fff;
    border-radius: 24px;
    padding: 28px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 30px rgba(150, 50, 80, .2);
  }
  h1 { font-size: 1.6rem; margin: 0 0 8px; }
  p { font-size: 1.05rem; line-height: 1.5; margin: 8px 0 18px; }
  .emoji { font-size: 3rem; }
  input {
    width: 100%;
    padding: 14px;
    font-size: 1rem;
    border: 2px solid #ffb3c6;
    border-radius: 14px;
    outline: none;
    margin-bottom: 14px;
  }
  input:focus { border-color: #ff6b8f; }
  button {
    width: 100%;
    padding: 14px;
    font-size: 1.05rem;
    font-weight: 600;
    color: #fff;
    background: #ff6b8f;
    border: none;
    border-radius: 14px;
    cursor: pointer;
  }
  button:active { transform: scale(.98); }
  .wa { background: #25d366; }
  .hidden { display: none; }
  .answer {
    background: #fff0f4;
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 14px;
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="card">
  <div id="step1">
    <div class="emoji">🚗💕</div>
    <h1>Ciao amore!</h1>
    <p>Mercoledì vengo da te! 🥰<br>Dove andiamo a cena?</p>
    <input id="place" type="text" placeholder="Scrivi il posto che preferisci..." autocomplete="off">
    <button onclick="send()">Conferma 💌</button>
  </div>

  <div id="step2" class="hidden">
    <div class="emoji">🍝✨</div>
    <h1>Perfetto!</h1>
    <div class="answer" id="answer"></div>
    <p>Ora mandami la risposta su WhatsApp 👇</p>
    <button class="wa" id="waBtn">Condividi su WhatsApp 💬</button>
  </div>
</div>

<script>
  function send() {
    const place = document.getElementById('place').value.trim();
    if (!place) { document.getElementById('place').focus(); return; }
    document.getElementById('answer').textContent = "Mercoledì a cena andiamo: " + place + " 😍";
    const text = "Ciao amore! Per mercoledì sera ho scelto di andare a cena: " + place + " 😍❤️";
    document.getElementById('waBtn').onclick = function () {
      window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
    };
    document.getElementById('step1').classList.add('hidden');
    document.getElementById('step2').classList.remove('hidden');
  }
  document.getElementById('place').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') send();
  });
</script>
</body>
</html>
